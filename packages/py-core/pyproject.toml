[project]
name = "xp-core"
version = "0.1.0"
description = "XP shared Python foundation: settings, logging, DB models, XP ledger, storage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "cryptography>=43",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "embit==0.8.0",
    "pypdf>=4.3",  # read PDFs people send to Satish AI
    "markdown-it-py>=3.0",  # Markdown in reports and answers (raw HTML off)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xp_core"]
