[project]
name = "xp-bot"
version = "0.1.0"
description = "XP Telegram bot (apps/bot) - aiogram 3 command router"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
    "aiogram>=3.15",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
