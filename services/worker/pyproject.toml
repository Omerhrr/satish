[project]
name = "xp-worker"
version = "0.1.0"
description = "XP background worker (services/worker) - arq queue + WeasyPrint PDF jobs"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
    "arq>=0.26",
    "redis>=5.2",
    "weasyprint>=63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
