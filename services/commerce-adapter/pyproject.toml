[project]
name = "xp-commerce-adapter"
version = "0.1.0"
description = "Commerce intelligence adapter: product trend scoring with transparent configurable signals, supplier/listing comparison, vehicle auction checks, ad-library fixture integration, landed-cost template, source freshness/confidence"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commerce_adapter"]
