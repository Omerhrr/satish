[project]
name = "xp-api"
version = "0.1.0"
description = "XP FastAPI application (services/api)"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "orjson>=3.10",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
