[project]
name = "xp-lightning-adapter"
version = "0.1.0"
description = "Lightning adapter protocol + stub - implementation chosen after channel-state/recovery review"
requires-python = ">=3.11"
dependencies = ["xp-core", "grpcio>=1.84"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightning_adapter"]
