[project]
name = "xp-agent-adapter"
version = "0.1.0"
description = "DSH agent adapter: allowlisted typed tool registry + DeepSeek client"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsh_adapter"]
