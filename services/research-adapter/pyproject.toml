[project]
name = "xp-research-adapter"
version = "0.1.0"
description = "Research tools adapter: permitted web fetch, canned search, extraction, provenance, cross-source comparison"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_adapter"]
