[project]
name = "xp-wallet-adapter"
version = "0.1.0"
description = "BDK-backed on-chain wallet provider (decision D10) + replaceable protocol"
requires-python = ">=3.11"
dependencies = ["xp-core", "bdkpython==3.1.1", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wallet_adapter"]
