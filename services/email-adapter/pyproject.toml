[project]
name = "xp-email-adapter"
version = "0.1.0"
description = "Email adapter: preview-before-send providers with honest outcome taxonomy (canned dev mode + real SMTP)"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_adapter"]
