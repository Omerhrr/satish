[project]
name = "xp-telegram-adapter"
version = "0.1.0"
description = "Telegram relay adapter: notification push providers with honest outcome taxonomy (canned dev mode + real Bot API)"
requires-python = ">=3.11"
dependencies = [
    "xp-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_adapter"]
